<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>RAG Chatbot</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --border: #2a2e38;
    --text: #e8e9ec;
    --muted: #8b92a3;
    --accent: #4f7cff;
    --user-bubble: #4f7cff;
    --bot-bubble: #23262f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, Segoe UI, Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    height: 100vh;
  }
  #sidebar {
    width: 300px;
    border-right: 1px solid var(--border);
    padding: 20px;
    background: var(--panel);
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  #sidebar h2 { font-size: 15px; margin: 0 0 4px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
  #dropzone {
    border: 1.5px dashed var(--border);
    border-radius: 10px;
    padding: 18px;
    text-align: center;
    font-size: 13px;
    color: var(--muted);
    cursor: pointer;
  }
  #dropzone:hover { border-color: var(--accent); color: var(--text); }
  #docList { list-style: none; padding: 0; margin: 0; overflow-y: auto; flex: 1; }
  #docList li {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 13px; padding: 8px 10px; border-radius: 8px; margin-bottom: 6px;
    background: #1d2029;
  }
  #docList li span.name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 190px; }
  #docList button { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 13px; }
  #docList button:hover { color: #ff6767; }
  #main { flex: 1; display: flex; flex-direction: column; }
  #chatHeader { padding: 18px 24px; border-bottom: 1px solid var(--border); }
  #chatHeader h1 { font-size: 16px; margin: 0; }
  #chatHeader p { margin: 4px 0 0; font-size: 12px; color: var(--muted); }
  #messages { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 14px; }
  .msg { max-width: 70%; padding: 12px 14px; border-radius: 12px; font-size: 14px; line-height: 1.5; }
  .msg.user { align-self: flex-end; background: var(--user-bubble); color: white; border-bottom-right-radius: 2px; }
  .msg.bot { align-self: flex-start; background: var(--bot-bubble); border-bottom-left-radius: 2px; }
  .msg .sources { margin-top: 8px; font-size: 11.5px; color: var(--muted); }
  #inputBar { display: flex; gap: 10px; padding: 16px 24px; border-top: 1px solid var(--border); }
  #questionInput {
    flex: 1; background: #1d2029; border: 1px solid var(--border); color: var(--text);
    border-radius: 10px; padding: 12px 14px; font-size: 14px; outline: none;
  }
  #questionInput:focus { border-color: var(--accent); }
  #sendBtn {
    background: var(--accent); color: white; border: none; border-radius: 10px;
    padding: 0 20px; font-size: 14px; cursor: pointer;
  }
  #sendBtn:disabled { opacity: .5; cursor: not-allowed; }
  #fileInput { display: none; }
  .empty { color: var(--muted); font-size: 13px; text-align: center; margin-top: 40px; }
</style>
</head>
<body>

<div id="sidebar">
  <h2>Knowledge Base</h2>
  <div id="dropzone">Click to upload PDF / DOCX / TXT / CSV / XLSX</div>
  <input type="file" id="fileInput" accept=".pdf,.docx,.txt,.csv,.xlsx,.xls">
  <ul id="docList"></ul>
</div>

<div id="main">
  <div id="chatHeader">
    <div style="display:flex; justify-content:space-between; align-items:flex-start;">
      <div>
        <h1>RAG Chatbot</h1>
        <p>Answers are grounded only in the documents you upload.</p>
      </div>
      <button id="newChatBtn" style="background:#1d2029; color:var(--muted); border:1px solid var(--border); border-radius:8px; padding:6px 12px; font-size:12px; cursor:pointer;">New chat</button>
    </div>
  </div>
  <div id="messages">
    <div class="empty">Upload a document, then ask a question about it.</div>
  </div>
  <div id="inputBar">
    <input id="questionInput" type="text" placeholder="Ask a question about your documents..." />
    <button id="sendBtn">Send</button>
  </div>
</div>

<script>
const dropzone = document.getElementById('dropzone');
const fileInput = document.getElementById('fileInput');
const docList = document.getElementById('docList');
const messages = document.getElementById('messages');
const questionInput = document.getElementById('questionInput');
const sendBtn = document.getElementById('sendBtn');
const newChatBtn = document.getElementById('newChatBtn');

// One session per browser tab, so follow-up questions ("what about the
// ghee version?") can reference earlier turns. Regenerated on page load
// and whenever "New chat" is clicked.
let sessionId = crypto.randomUUID();

dropzone.addEventListener('click', () => fileInput.click());

fileInput.addEventListener('change', async () => {
  if (!fileInput.files.length) return;
  const file = fileInput.files[0];
  dropzone.textContent = `Uploading ${file.name}...`;
  const formData = new FormData();
  formData.append('file', file);

  try {
    const res = await fetch('/api/documents/upload', { method: 'POST', body: formData });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || 'Upload failed');
    dropzone.textContent = 'Click to upload PDF / DOCX / TXT / CSV / XLSX';
    loadDocuments();
  } catch (err) {
    dropzone.textContent = 'Click to upload PDF / DOCX / TXT / CSV / XLSX';
    alert('Upload failed: ' + err.message);
  }
  fileInput.value = '';
});

async function loadDocuments() {
  const res = await fetch('/api/documents');
  const docs = await res.json();
  docList.innerHTML = '';
  docs.forEach(doc => {
    const li = document.createElement('li');
    li.innerHTML = `<span class="name" title="${doc.filename}">${doc.filename}</span>`;
    const btn = document.createElement('button');
    btn.textContent = '✕';
    btn.onclick = async () => {
      await fetch(`/api/documents/${doc.id}`, { method: 'DELETE' });
      loadDocuments();
    };
    li.appendChild(btn);
    docList.appendChild(li);
  });
}

function addMessage(role, text, sources) {
  const empty = messages.querySelector('.empty');
  if (empty) empty.remove();
  const div = document.createElement('div');
  div.className = `msg ${role}`;
  div.textContent = text;
  if (sources && sources.length) {
    const src = document.createElement('div');
    src.className = 'sources';
    src.textContent = 'Source: ' + sources.map(s => `${s.filename} (p. ${s.page_number})`).join(', ');
    div.appendChild(src);
  }
  messages.appendChild(div);
  messages.scrollTop = messages.scrollHeight;
}

async function sendQuestion() {
  const question = questionInput.value.trim();
  if (!question) return;
  addMessage('user', question);
  questionInput.value = '';
  sendBtn.disabled = true;

  try {
    const res = await fetch('/api/ask', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question, session_id: sessionId })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || 'Something went wrong');
    addMessage('bot', data.answer, data.sources);
  } catch (err) {
    addMessage('bot', 'Error: ' + err.message);
  }
  sendBtn.disabled = false;
}

newChatBtn.addEventListener('click', async () => {
  await fetch(`/api/conversations/${sessionId}`, { method: 'DELETE' });
  sessionId = crypto.randomUUID();
  messages.innerHTML = '<div class="empty">Upload a document, then ask a question about it.</div>';
});

sendBtn.addEventListener('click', sendQuestion);
questionInput.addEventListener('keydown', e => { if (e.key === 'Enter') sendQuestion(); });

loadDocuments();
</script>
</body>
</html>
